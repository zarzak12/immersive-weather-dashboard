name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify dist output
        run: test -f dist/immersive-weather-dashboard.js

      - name: Create GitHub release with dist asset
        uses: softprops/action-gh-release@v3
        with:
          files: dist/immersive-weather-dashboard.js
          generate_release_notes: true

      - name: Validate HACS repository
        uses: hacs/action@main
        with:
          category: plugin
